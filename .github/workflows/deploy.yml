# ─── Family Travel Companion App ─ CI/CD Pipeline ────────────────────────────
# Builds standalone Next.js output, previews Bicep on every deploy, applies
# infra only when infra files changed or manually requested, then deploys app.
# Uses OIDC federated credentials and managed identity for app-to-database auth.

name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: "Deploy infrastructure changes"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  id-token: write # Required for OIDC federated credential
  contents: read

env:
  NODE_VERSION: "20.x"

jobs:
  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      # Package standalone output with static assets, public folder, and prisma
      - name: Prepare deployment package
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r prisma .next/standalone/prisma
          cp package.json .next/standalone/

      # Create zip using tar (more reliable than zip for preserving structure)
      - name: Create deployment zip
        run: |
          cd .next/standalone
          zip -qr ../../deploy.zip .
          cd ../..

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 1

  # ─── Provision Infrastructure ──────────────────────────────────────────────
  infra:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    outputs:
      webapp_name: ${{ steps.infra-outputs.outputs.webapp_name }}
      resource_group: ${{ steps.infra-outputs.outputs.resource_group }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve PostgreSQL Entra admin principal
        id: entra-admin
        run: |
          ADMIN_NAME=$(az ad sp show --id ${{ vars.AZURE_CLIENT_ID }} --query displayName -o tsv)
          echo "name=$ADMIN_NAME" >> "$GITHUB_OUTPUT"

      - name: Detect infrastructure changes
        id: infra-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deploy_infra }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" | grep -Eq '^(infra/|azure.yaml|\.github/workflows/deploy\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview Azure Infrastructure (what-if)
        run: |
          az deployment sub what-if \
            --location ${{ vars.AZURE_LOCATION }} \
            --template-file infra/main.bicep \
            --parameters \
              environmentName=${{ vars.AZURE_ENV_NAME || 'familytravelapp' }} \
              location=${{ vars.AZURE_LOCATION }} \
              resourceGroupName=${{ vars.AZURE_RESOURCE_GROUP }} \
              postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
              appServiceName=${{ vars.AZURE_WEBAPP_NAME }} \
              postgresEntraAdminPrincipalName='${{ steps.entra-admin.outputs.name }}'

      - name: Deploy Azure Infrastructure (Bicep)
        id: deploy-bicep
        if: steps.infra-changes.outputs.changed == 'true'
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ vars.AZURE_LOCATION }}
          template: infra/main.bicep
          parameters: >-
            environmentName=${{ vars.AZURE_ENV_NAME || 'familytravelapp' }}
            location=${{ vars.AZURE_LOCATION }}
            resourceGroupName=${{ vars.AZURE_RESOURCE_GROUP }}
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            appServiceName=${{ vars.AZURE_WEBAPP_NAME }}
            postgresEntraAdminPrincipalName='${{ steps.entra-admin.outputs.name }}'
          deploymentName: family-travel-${{ github.run_number }}

      - name: Save infra outputs
        id: infra-outputs
        run: |
          if [ "${{ steps.infra-changes.outputs.changed }}" = "true" ]; then
            echo "webapp_name=${{ steps.deploy-bicep.outputs.AZURE_WEBAPP_NAME }}" >> "$GITHUB_OUTPUT"
            echo "resource_group=${{ steps.deploy-bicep.outputs.AZURE_RESOURCE_GROUP }}" >> "$GITHUB_OUTPUT"
          else
            echo "webapp_name=${{ vars.AZURE_WEBAPP_NAME }}" >> "$GITHUB_OUTPUT"
            echo "resource_group=${{ vars.AZURE_RESOURCE_GROUP }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure logout
        if: always()
        run: az logout

  # ─── Deploy App ────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build, infra]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Web App and Resource Group names
        id: webapp
        run: |
          # Use infra output if available, otherwise fall back to variable
          WEBAPP_NAME="${{ needs.infra.outputs.webapp_name }}"
          if [ -z "$WEBAPP_NAME" ]; then
            WEBAPP_NAME="${{ vars.AZURE_WEBAPP_NAME }}"
          fi
          RG_NAME="${{ needs.infra.outputs.resource_group }}"
          if [ -z "$RG_NAME" ]; then
            RG_NAME="${{ vars.AZURE_RESOURCE_GROUP }}"
          fi
          echo "name=$WEBAPP_NAME" >> "$GITHUB_OUTPUT"
          echo "rg=$RG_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve PostgreSQL and managed identity metadata
        id: postgres
        run: |
          PG_NAME=$(az postgres flexible-server list \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --query "[0].name" -o tsv)
          PG_HOST=$(az postgres flexible-server show \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --name "$PG_NAME" \
            --query "fullyQualifiedDomainName" -o tsv)
          PG_ADMIN=$(az postgres flexible-server show \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --name "$PG_NAME" \
            --query "administratorLogin" -o tsv)
          PG_DB=$(az postgres flexible-server db list \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --server-name "$PG_NAME" \
            --query "[?name!='postgres'] | [0].name" -o tsv)
          MI_NAME=$(az identity list \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --query "[0].name" -o tsv)
          ADMIN_NAME=$(az ad sp show --id ${{ vars.AZURE_CLIENT_ID }} --query displayName -o tsv)
          echo "server=$PG_NAME" >> "$GITHUB_OUTPUT"
          echo "host=$PG_HOST" >> "$GITHUB_OUTPUT"
          echo "admin_login=$PG_ADMIN" >> "$GITHUB_OUTPUT"
          echo "database=$PG_DB" >> "$GITHUB_OUTPUT"
          echo "managed_identity_name=$MI_NAME" >> "$GITHUB_OUTPUT"
          echo "admin_name=$ADMIN_NAME" >> "$GITHUB_OUTPUT"

      # Ensure the PostgreSQL server is running before deploying
      - name: Start PostgreSQL server (if stopped)
        run: |
          PG_NAME=$(az postgres flexible-server list \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --query "[0].name" -o tsv 2>/dev/null || true)
          if [ -n "$PG_NAME" ]; then
            STATE=$(az postgres flexible-server show \
              --resource-group ${{ steps.webapp.outputs.rg }} \
              --name "$PG_NAME" \
              --query "state" -o tsv)
            if [ "$STATE" != "Ready" ]; then
              echo "Starting PostgreSQL server $PG_NAME..."
              az postgres flexible-server start \
                --resource-group ${{ steps.webapp.outputs.rg }} \
                --name "$PG_NAME"
            else
              echo "PostgreSQL server $PG_NAME is already running."
            fi
          fi

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ensure managed identity database principal exists
        run: |
          PG_TOKEN=$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)
          export PGPASSWORD="$PG_TOKEN"
          psql "host=${{ steps.postgres.outputs.host }} port=5432 dbname=postgres user=${{ steps.postgres.outputs.admin_name }} sslmode=require" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ steps.postgres.outputs.managed_identity_name }}') THEN
              PERFORM * FROM pgaadauth_create_principal('${{ steps.postgres.outputs.managed_identity_name }}', false, false);
            END IF;
          END
          $$;
          SQL

      - name: Grant app database permissions to managed identity
        run: |
          PG_TOKEN=$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)
          export PGPASSWORD="$PG_TOKEN"
          psql "host=${{ steps.postgres.outputs.host }} port=5432 dbname=${{ steps.postgres.outputs.database }} user=${{ steps.postgres.outputs.admin_name }} sslmode=require" <<'SQL'
          GRANT CONNECT ON DATABASE "${{ steps.postgres.outputs.database }}" TO "${{ steps.postgres.outputs.managed_identity_name }}";
          GRANT USAGE ON SCHEMA public TO "${{ steps.postgres.outputs.managed_identity_name }}";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO "${{ steps.postgres.outputs.managed_identity_name }}";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO "${{ steps.postgres.outputs.managed_identity_name }}";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${{ steps.postgres.outputs.managed_identity_name }}";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "${{ steps.postgres.outputs.managed_identity_name }}";
          SQL

      # Deploy the zip directly — Oryx is disabled in Bicep app settings
      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --name ${{ steps.webapp.outputs.name }} \
            --src-path deploy.zip \
            --type zip \
            --clean true

      - name: Verify deployment
        run: |
          SITE_URL=$(az webapp show \
            --resource-group ${{ steps.webapp.outputs.rg }} \
            --name ${{ steps.webapp.outputs.name }} \
            --query "defaultHostName" -o tsv)
          echo "Deployed to https://$SITE_URL"
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$SITE_URL" --max-time 30 || echo "000")
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Health check returned HTTP $HTTP_CODE"
          fi

      - name: Run Prisma Migrations
        run: |
          export DATABASE_URL="postgresql://${{ steps.postgres.outputs.admin_login }}:${{ secrets.POSTGRES_ADMIN_PASSWORD }}@${{ steps.postgres.outputs.host }}:5432/${{ steps.postgres.outputs.database }}?schema=public&sslmode=require"
          npm install prisma@latest --no-save
          npx prisma migrate deploy

      - name: Azure logout
        if: always()
        run: az logout
